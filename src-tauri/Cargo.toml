[package]
name = "ghost"
version = "0.1.0"
edition = "2021"

[lib]
name = "ghost_lib"
crate-type = ["staticlib", "cdylib"]
# Note: binary targets in the same package resolve the lib via the package name (ghost → ghost_lib).
# Rust requires explicit extern crate when lib name != package name; we handle this in main.rs.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri     = { version = "2", features = ["macos-private-api"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
tokio     = { version = "1", features = ["full"] }
portable-pty = "0.8"
base64    = { version = "0.22", features = ["std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
