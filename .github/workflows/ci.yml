name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Run tests
        run: uv run pytest --tb=short -q --cov=gits --cov-report=term-missing
