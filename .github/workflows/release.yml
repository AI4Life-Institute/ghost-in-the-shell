name: Release & Update Homebrew Tap

on:
  push:
    branches: [master]
    paths: [pyproject.toml]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: ver
        run: |
          VER=$(grep '^version' pyproject.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag & GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes

      - name: Compute SHA256 of release tarball
        if: steps.check.outputs.exists == 'false'
        id: sha
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL"    >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap formula
        if: steps.check.outputs.exists == 'false'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          # Fetch current file + sha from tap repo
          RESP=$(curl -fsSL -H "Authorization: token $TAP_TOKEN" \
            "https://api.github.com/repos/AI4Life-Institute/homebrew-tap/contents/Formula/ghost.rb")
          FILE_SHA=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")

          # Build updated formula
          REPO="${{ github.repository }}"
          VER="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"

          FORMULA=$(curl -sL -H "Authorization: token $TAP_TOKEN" \
            "https://api.github.com/repos/AI4Life-Institute/homebrew-tap/contents/Formula/ghost.rb" \
            | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode())")

          UPDATED=$(echo "$FORMULA" \
            | sed "s|url \"https://github.com/.*/archive/refs/tags/v.*.tar.gz\"|url \"${URL}\"|" \
            | sed "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            | sed "s|version \".*\"|version \"${VER}\"|")

          CONTENT=$(echo "$UPDATED" | base64 -w 0)

          curl -fsSL -X PUT \
            -H "Authorization: token $TAP_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/AI4Life-Institute/homebrew-tap/contents/Formula/ghost.rb" \
            -d "{\"message\":\"chore(ghost): bump to ${TAG}\",\"content\":\"${CONTENT}\",\"sha\":\"${FILE_SHA}\"}"
