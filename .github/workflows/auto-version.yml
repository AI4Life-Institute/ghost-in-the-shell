name: Auto Version Bump

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  bump:
    # Only on actual merges, not closed-without-merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version in pyproject.toml
        id: bump
        run: |
          OLD=$(grep '^version' pyproject.toml | sed 's/.*= *"\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/^version = \"${OLD}\"/version = \"${NEW}\"/" pyproject.toml
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }}"
          git push

  notify:
    needs: bump
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        run: |
          curl -fsSL -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **Auto version bump failed** — ${{ github.workflow }}\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
