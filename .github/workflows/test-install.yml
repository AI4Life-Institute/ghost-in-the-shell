name: Test Install Script

on:
  push:
    branches: [master]
    paths:
      - install.sh
  pull_request:
    paths:
      - install.sh
  workflow_dispatch:

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Run install script
        run: bash install.sh

      - name: Verify ghost runs
        run: |
          ghost --help
          gits --help

  notify:
    needs: install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        run: |
          if [ "${{ needs.install.result }}" = "failure" ]; then
            ICON="❌"
          else
            ICON="✅"
          fi
          curl -fsSL -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"${ICON} **Install test**\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
