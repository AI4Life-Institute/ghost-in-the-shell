[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-in-the-shell"
version = "0.2.39"
description = "Social platform <-> tmux bridge for coding CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "libtmux>=0.37.0",
    "discord.py>=2.4",
    "Pillow>=10.0",
    "pydantic-settings>=2.0",
    "watchfiles>=1.1.1",
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    "croniter>=2.0",
    "aiohttp>=3.9",
    "cryptography>=46.0.5",
    "qrcode>=8.2",
    "questionary>=2.1.1",
    "posthog>=3.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
]

[project.scripts]
ghost = "gits.__main__:main"
gits = "gits.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gits"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

