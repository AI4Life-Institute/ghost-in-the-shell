[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-in-the-shell"
version = "0.1.0"
description = "Social platform <-> tmux bridge for coding CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "libtmux>=0.37.0",
    "discord.py>=2.4",
    "Pillow>=10.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
gits = "gits.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gits"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
